name: CI/CD Pipeline - Docker Build and Push

# Este flujo se ejecutará cada vez que hagas un push a la rama principal
on:
  push:
    branches:
      - main # Cambia a 'master' si tu rama principal se llama master

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest # Máquina virtual donde se ejecutará el proceso

    steps:
      # 1. Checkout: Clona tu código en la máquina virtual de GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Buildx: Herramienta avanzada de Docker para builds multi-arquitectura y caché
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Login: Se autentica usando los secretos que configuraste en el Paso 3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and Push: Construye la imagen con el Dockerfile y la sube a tu repositorio
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # IMPORTANTE: Reemplaza 'tu_usuario_docker' con tu usuario real (en minúsculas)
          tags: ${{ secrets.DOCKER_USERNAME }}/docker-test-robledo:latest